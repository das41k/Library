<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог книг</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <header class="page-header">
        <h1>📖 Каталог книг</h1>
        <p>Все доступные книги в библиотеке</p>
    </header>

    <div th:if="${bookList.empty}">
        <div class="empty-state">
            <div class="empty-icon">
                <i class="fas fa-book-open"></i>
            </div>
            <h3>Каталог книг пуст</h3>
            <p>Добавьте первую книгу в библиотеку</p>
            <a th:href="@{/book/new}" class="btn btn-primary">
                <i class="fas fa-plus btn-icon"></i> Добавить книгу
            </a>
        </div>
    </div>

    <div th:if="not ${bookList.empty}">
        <div class="table-container">
            <table class="data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Название</th>
                    <th>Автор</th>
                    <th>Год издания</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book, iterStat : ${bookList}">
                    <td th:text="${iterStat.index + 1}">1</td>
                    <td th:text="${book.title}">Война и мир</td>
                    <td th:text="${book.author}">Толстой Лев Николаевич</td>
                    <td th:text="${book.dateCreate}">2025-06-06</td>
                    <td>
                        <div class="action-links">
                            <a th:href="@{/book/{id}(id=${book.id})}"
                               class="action-link action-view">
                                <i class="fas fa-eye"></i> Просмотр
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="btn-group">
            <a th:href="@{/book/new}" class="btn btn-primary">
                <i class="fas fa-plus btn-icon"></i> Добавить новую книгу
            </a>
            <a th:href="@{/}" class="btn btn-secondary">
                <i class="fas fa-home btn-icon"></i> На главную
            </a>
        </div>
    </div>

    <footer class="page-footer">
        <p>Показано книг: <strong th:text="${bookList.size()}">0</strong></p>
    </footer>
</div>
</body>
</html>
