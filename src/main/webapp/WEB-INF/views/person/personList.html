<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список читателей</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <header class="page-header">
        <h1>👥 Читатели библиотеки</h1>
        <p>Список зарегистрированных читателей</p>
    </header>

    <!-- Сообщения об ошибках -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Информационные сообщения -->
    <div th:if="${info}" class="alert alert-info">
        <p th:text="${info}"></p>
    </div>

    <!-- Состояние пустого списка -->
    <div th:if="${peopleList.empty}">
        <div class="empty-state">
            <div class="empty-icon">
                <i class="fas fa-user-friends"></i>
            </div>
            <h3>Список читателей пуст</h3>
            <p>Добавьте первого читателя в систему</p>
            <a th:href="@{/people/new}" class="btn btn-primary">
                <i class="fas fa-user-plus btn-icon"></i> Добавить читателя
            </a>
        </div>
    </div>

    <!-- Таблица с читателями -->
    <div th:if="not ${peopleList.empty}">
        <div class="table-container">
            <table class="data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>ФИО</th>
                    <th>Дата рождения</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="person, iterStat : ${peopleList}">
                    <td th:text="${iterStat.index + 1}">1</td>
                    <td th:text="${person.fio}">Иванов И.И.</td>
                    <td th:text="${person.dateBirth}">1990-01-01</td>
                    <td>
                        <div class="action-links">
                            <a th:href="@{/people/{id}(id=${person.id})}"
                               class="action-link action-view">
                                <i class="fas fa-eye"></i> Просмотр
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="btn-group">
            <a th:href="@{/people/new}" class="btn btn-primary">
                <i class="fas fa-user-plus btn-icon"></i> Добавить нового читателя
            </a>
            <a th:href="@{/}" class="btn btn-secondary">
                <i class="fas fa-home btn-icon"></i> На главную
            </a>
        </div>
    </div>

    <footer class="page-footer">
        <p>Всего читателей: <strong th:text="${peopleList.size()}">0</strong></p>
    </footer>
</div>
</body>
</html>
